plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {

    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword "pulsequant123"
            keyAlias "pulsequant"
            keyPassword "pulsequant123"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    namespace 'com.example.rhythmtrader'
    compileSdk 34

    defaultConfig {
        applicationId "com.pulsequant.mobile"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "8.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
